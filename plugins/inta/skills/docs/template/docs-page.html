<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{PAGE_TITLE}} — {{PRODUCT_NAME}}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: "#000000",
              sub: "#000000",
              line: "#000000",
              brand: { 50: "#FFFFFF", 500: "#000000", 600: "#000000" },
            },
            fontFamily: {
              sans: ["Noto Sans JP", "system-ui", "sans-serif"],
              heading: ["Montserrat", "Noto Sans JP", "system-ui", "sans-serif"],
            },
          },
        },
      }
    </script>
    <style>
      [id] {
        scroll-margin-top: 32px;
      }
    </style>
  </head>
  <body class="bg-white text-ink font-sans antialiased">
    <header>
      <div class="mx-auto flex max-w-3xl items-center justify-between px-8 py-4">
        <a href="index.html" class="font-heading text-lg font-bold">{{PRODUCT_NAME}}</a>
        <nav class="text-xs text-sub">
          <a href="index.html" class="hover:text-brand-500">← 目次に戻る</a>
        </nav>
      </div>
    </header>

    <main class="mx-auto max-w-3xl px-8 py-16">
      <p class="font-heading text-xs font-semibold tracking-widest text-brand-500">
        {{SECTION_NUMBER}} / {{SECTION_TAG}}
      </p>
      <h1 class="mt-4 pb-4 text-[48px] font-bold leading-tight">
        {{PAGE_TITLE}}
      </h1>

      <p class="mt-8 text-sub leading-relaxed">{{LEDE_PARAGRAPH}}</p>

      <h2 class="mt-16 pt-16 pb-2 text-[32px] font-semibold">{{H2_HEADING}}</h2>
      <p class="mt-4 text-sub leading-relaxed">{{H2_BODY}}</p>

      <ul class="mt-8 space-y-4 text-sub leading-relaxed">
        <li class="border-l border-black py-4 pl-8">{{LIST_ITEM}}</li>
      </ul>

      <article class="mt-8 border border-line p-8">
        <div class="flex flex-wrap items-baseline justify-between gap-4">
          <h3 class="text-[20px] font-semibold">{{CARD_TITLE}}</h3>
          <span class="font-mono text-xs text-sub">{{CARD_SLUG}}</span>
        </div>
        <p class="mt-4 text-sub leading-relaxed">{{CARD_DESCRIPTION}}</p>
        <p class="mt-8 font-heading text-xs font-semibold tracking-widest text-brand-500">
          主な機能
        </p>
        <ul class="mt-4 space-y-4 text-sub leading-relaxed">
          <li class="border-l border-black py-4 pl-8">{{CARD_LIST_ITEM}}</li>
        </ul>
      </article>

      <nav class="mt-16 flex items-center justify-between pt-16 text-sm">
        <a href="{{PREV_HREF}}" class="text-sub hover:text-brand-500">← {{PREV_TITLE}}</a>
        <a href="{{NEXT_HREF}}" class="font-medium text-brand-600 hover:text-brand-500">
          次: {{NEXT_TITLE}} →
        </a>
      </nav>
    </main>
  </body>
</html>
