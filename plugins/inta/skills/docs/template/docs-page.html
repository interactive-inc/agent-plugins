<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{PAGE_TITLE}} — {{PRODUCT_NAME}}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: "#0F0F12",
              sub: "#3F3F46",
              line: "#E6E6E9",
              brand: { 50: "{{BRAND_50}}", 500: "{{BRAND_500}}", 600: "{{BRAND_600}}" },
            },
            fontFamily: {
              sans: ["Noto Sans JP", "system-ui", "sans-serif"],
              heading: ["Montserrat", "Noto Sans JP", "system-ui", "sans-serif"],
            },
          },
        },
      }
    </script>
    <style>
      [id] {
        scroll-margin-top: 24px;
      }
    </style>
  </head>
  <body class="bg-white text-ink font-sans antialiased">
    <header class="border-b border-line">
      <div class="mx-auto flex max-w-3xl items-center justify-between px-6 py-4">
        <a href="index.html" class="font-heading text-lg font-bold">{{PRODUCT_NAME}}</a>
        <nav class="text-xs text-sub">
          <a href="index.html" class="hover:text-brand-500">← 目次に戻る</a>
        </nav>
      </div>
    </header>

    <main class="mx-auto max-w-3xl px-6 py-16">
      <p class="font-heading text-xs font-semibold tracking-widest text-brand-500">
        {{SECTION_NUMBER}} / {{SECTION_TAG}}
      </p>
      <h1 class="mt-3 border-b-2 border-brand-500 pb-4 text-4xl font-bold leading-tight">
        {{PAGE_TITLE}}
      </h1>

      <p class="mt-6 text-sub leading-relaxed">{{LEDE_PARAGRAPH}}</p>

      <h2 class="mt-12 border-b border-line pb-2 text-xl font-semibold">{{H2_HEADING}}</h2>
      <p class="mt-4 text-sub leading-relaxed">{{H2_BODY}}</p>

      <ul class="mt-4 space-y-3 text-sub leading-relaxed">
        <li class="flex gap-3">
          <span class="mt-2 h-1.5 w-1.5 shrink-0 rounded-full bg-brand-500"></span>
          <span>{{LIST_ITEM}}</span>
        </li>
      </ul>

      <article class="mt-6 rounded-2xl border border-line p-6">
        <div class="flex flex-wrap items-baseline justify-between gap-3">
          <h3 class="text-lg font-semibold">{{CARD_TITLE}}</h3>
          <span class="font-mono text-xs text-sub">{{CARD_SLUG}}</span>
        </div>
        <p class="mt-3 text-sub leading-relaxed">{{CARD_DESCRIPTION}}</p>
        <p class="mt-4 font-heading text-xs font-semibold tracking-widest text-brand-500">
          主な機能
        </p>
        <ul class="mt-2 space-y-2 text-sm text-sub leading-relaxed">
          <li class="flex gap-2">
            <span class="mt-2 h-1 w-1 shrink-0 rounded-full bg-brand-500"></span>
            <span>{{CARD_LIST_ITEM}}</span>
          </li>
        </ul>
      </article>

      <nav class="mt-20 flex items-center justify-between border-t border-line pt-6 text-sm">
        <a href="{{PREV_HREF}}" class="text-sub hover:text-brand-500">← {{PREV_TITLE}}</a>
        <a href="{{NEXT_HREF}}" class="font-medium text-brand-600 hover:text-brand-500">
          次: {{NEXT_TITLE}} →
        </a>
      </nav>
    </main>
  </body>
</html>
